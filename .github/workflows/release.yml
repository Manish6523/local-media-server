name: Release Build

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ── Windows & macOS builds (native runners) ──
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    # Needs write permissions to publish releases
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Configure NPM cache on Windows to avoid cross-drive Next.js tracing bug
        if: matrix.os == 'windows-latest'
        run: npm config set cache D:\npm-cache --global

      - name: Install NPM dependencies
        run: npm ci || npm install

      - name: Remove WindowsApps reparse-point stubs (Windows EACCES workaround)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          rd /s /q "%LOCALAPPDATA%\Microsoft\WindowsApps" 2>nul
          mkdir "%LOCALAPPDATA%\Microsoft\WindowsApps"

      - name: Build and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            npm run electron:build:win -- -p always
          elif [ "$RUNNER_OS" == "macOS" ]; then
            npm run electron:build:mac -- -p always
          fi
        shell: bash

  # ── Linux build (Docker container for GLIBC compatibility) ──
  build-linux:
    name: Build on Linux (Docker)
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci || npm install

      - name: Build Next.js and compile Electron TS
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
          npx tsc -p tsconfig.electron.json

      - name: Build Linux packages in Docker (GLIBC 2.31 compatible)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GH_TOKEN="${GH_TOKEN}" \
            -v "$(pwd):/project" \
            -w /project \
            electronuserland/builder:20 \
            /bin/bash -c "npx electron-builder --linux -p always"
